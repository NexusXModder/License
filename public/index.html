<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusGuard // Enterprise License Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .glass { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glow:focus { box-shadow: 0 0 20px rgba(99, 102, 241, 0.4); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 md:p-8 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">

    <!-- Login Matrix View -->
    <div id="loginBox" class="glass w-full max-w-md p-8 rounded-2xl shadow-2xl transition-all duration-500">
        <div class="flex items-center justify-center mb-6">
            <div class="h-12 w-12 rounded-xl bg-indigo-600/20 border border-indigo-500/40 flex items-center justify-center text-indigo-400 font-bold text-xl shadow-inner">⚡</div>
        </div>
        <h1 class="text-2xl font-bold text-center tracking-tight text-white mb-2">NexusGuard Terminal</h1>
        <p class="text-xs text-slate-400 text-center mb-6 uppercase tracking-widest font-mono">Secure Authorization Required</p>
        
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Master Password</label>
                <input type="password" id="adminPassword" placeholder="••••••••••••••••" class="w-full bg-slate-900/80 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 glow transition-all">
            </div>
            <button onclick="adminLogin()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition-all shadow-lg shadow-indigo-600/30 text-sm tracking-wide">Initialize Session</button>
            <p id="loginError" class="text-rose-400 text-xs text-center mt-2 font-medium hidden">Access Denied: Invalid Credentials</p>
        </div>
    </div>

    <!-- Main Dashboard View -->
    <div id="dashboardBox" class="w-full max-w-6xl glass p-6 md:p-8 rounded-2xl shadow-2xl hidden transition-all duration-500">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center pb-6 border-b border-slate-800/80 gap-4">
            <div class="flex items-center space-x-3">
                <div class="h-10 w-10 rounded-lg bg-indigo-600/20 border border-indigo-500/40 flex items-center justify-center text-indigo-400 font-bold text-lg">⚡</div>
                <div>
                    <h1 class="text-xl font-bold text-white tracking-tight">License Command Center</h1>
                    <p class="text-xs text-slate-400 font-mono">Environment: Render Cloud // Node-Engine</p>
                </div>
            </div>
            <button onclick="logout()" class="bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 text-rose-400 px-4 py-2 rounded-xl text-xs font-semibold transition-all">Terminate Session</button>
        </div>

        <!-- Generator Section -->
        <div class="my-6 bg-slate-900/50 border border-slate-800/80 p-6 rounded-xl">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-indigo-400 mb-4 font-mono">Generate New License Key</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Client / App Name</label>
                    <input type="text" id="keyName" placeholder="e.g. Araf_VIP_Client" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition-all">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Duration (Days)</label>
                    <input type="number" id="durationDays" value="30" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition-all">
                </div>
                <div class="flex items-end">
                    <button onclick="generateKey()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-xl transition-all shadow-lg shadow-indigo-600/20 text-sm">Generate Key</button>
                </div>
            </div>
        </div>

        <!-- Keys Table Section -->
        <div class="flex justify-between items-center mb-3">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-300 font-mono">Active Database Keys</h2>
            <span id="keyCount" class="text-xs font-mono bg-slate-900 border border-slate-800 px-2.5 py-1 rounded-lg text-indigo-400">Total: 0</span>
        </div>
        
        <div class="overflow-x-auto rounded-xl border border-slate-800/80 bg-slate-900/30">
            <table class="w-full text-left text-sm">
                <thead class="bg-slate-900/80 text-slate-400 text-xs uppercase font-mono tracking-wider border-b border-slate-800">
                    <tr>
                        <th class="p-4">Target Name</th>
                        <th class="p-4">License Key String</th>
                        <th class="p-4">Expiry Date</th>
                        <th class="p-4">Status</th>
                        <th class="p-4 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="keyTableBody" class="divide-y divide-slate-800/60 text-slate-300">
                    <!-- Dynamic Rows Here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const storedPassword = localStorage.getItem('nexus_admin_pass');
        if (storedPassword) verifyStoredPassword(storedPassword);

        async function adminLogin() {
            const password = document.getElementById('adminPassword').value;
            const res = await fetch('/api/admin-login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });
            const data = await res.json();

            if (data.success) {
                localStorage.setItem('nexus_admin_pass', password);
                showDashboard();
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        async function verifyStoredPassword(password) {
            const res = await fetch('/api/admin-login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });
            const data = await res.json();
            if (data.success) showDashboard();
            else localStorage.removeItem('nexus_admin_pass');
        }

        function showDashboard() {
            document.getElementById('loginBox').classList.add('hidden');
            document.getElementById('dashboardBox').classList.remove('hidden');
            fetchKeys();
        }

        function logout() {
            localStorage.removeItem('nexus_admin_pass');
            location.reload();
        }

        async function fetchKeys() {
            const password = localStorage.getItem('nexus_admin_pass');
            const res = await fetch('/api/keys', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });
            const keys = await res.json();
            const tbody = document.getElementById('keyTableBody');
            document.getElementById('keyCount').innerText = `Total: ${keys.length}`;
            tbody.innerHTML = '';

            if(keys.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-500 font-mono text-xs">No active keys generated yet.</td></tr>`;
                return;
            }

            keys.forEach(k => {
                const isExpired = new Date() > new Date(k.expiresAt);
                const statusBadge = isExpired 
                    ? `<span class="px-2 py-0.5 bg-rose-500/10 border border-rose-500/20 text-rose-400 rounded text-xs font-mono">Expired</span>`
                    : `<span class="px-2 py-0.5 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 rounded text-xs font-mono">Active</span>`;

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-900/40 transition-all">
                        <td class="p-4 font-semibold text-white">${k.name}</td>
                        <td class="p-4 font-mono text-indigo-400 tracking-wider">${k.key}</td>
                        <td class="p-4 font-mono text-xs text-slate-400">${new Date(k.expiresAt).toLocaleDateString()}</td>
                        <td class="p-4">${statusBadge}</td>
                        <td class="p-4 text-right">
                            <button onclick="navigator.clipboard.writeText('${k.key}'); alert('Key Copied!');" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg text-xs font-medium mr-2 transition-all">Copy</button>
                            <button onclick="deleteKey('${k.id}')" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 px-3 py-1.5 rounded-lg text-xs font-medium transition-all">Revoke</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function generateKey() {
            const password = localStorage.getItem('nexus_admin_pass');
            const name = document.getElementById('keyName').value;
            const durationDays = document.getElementById('durationDays').value;

            const res = await fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, durationDays, password })
            });

            const result = await res.json();
            if (result.success) {
                document.getElementById('keyName').value = '';
                fetchKeys();
            } else {
                alert('Generation failed: Unauthorized');
            }
        }

        async function deleteKey(id) {
            if (confirm('Are you sure you want to revoke this license key?')) {
                await fetch(`/api/key/${id}`, { method: 'DELETE' });
                fetchKeys();
            }
        }
    </script>
</body>
</html>
